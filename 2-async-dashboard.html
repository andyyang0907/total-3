<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>异步加载看板</title>

  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    .chart-box { height: 320px; }
  </style>
</head>

<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">← 作品集首页</a>
      <span class="navbar-text text-white-50">异步加载 + ECharts + Chart.js</span>
    </div>
  </nav>

  <header>
    <h1 class="h3">校园图书借阅数据看板</h1>
    <p class="text-muted small" id="sub-title"></p>
  </header>

  <p id="status" class="alert alert-warning" style="display: none;"></p>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h6">各月借阅量（ECharts 柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h6">借阅趋势（Chart.js 折线图）</h2>
      <div class="chart-box">
        <canvas id="line-chart"></canvas>
      </div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script>
    const state = { data: null };

    const loadData = async () => {
      $('#status').text('加载中...').show();
      try {
        const response = await fetch('data/library.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (data.series.length === 0) {
          $('#status').text('暂无数据').show();
          return;
        }
        state.data = data;
        $('#sub-title').text(data.title + ' · 数据来源：校园图书馆模拟数据');
        $('#status').hide();
        renderCards(data);
        renderBarChart(data);
        renderLineChart(data);
      } catch (error) {
        $('#status').text('加载失败：' + error.message).show();
      }
    };

    const renderCards = data => {
      data.series.forEach(s => {
        const total = s.counts.reduce((sum, n) => sum + n, 0);
        $('#cards').append(`
          <div class="col-md-4">
            <div class="card">
              <div class="card-body">
                <h3 class="card-title h6">${s.category}</h3>
                <p class="card-text fs-4">${total}</p>
                <p class="card-text small text-muted">共${data.months.length}个月累计借阅</p>
              </div>
            </div>
          </div>
        `);
      });
    };

    let barChart = null;
    const renderBarChart = data => {
      if (barChart === null) barChart = echarts.init(document.querySelector('#bar-chart'));
      barChart.setOption({
        title: { text: '各类别累计借阅量', left: 'center' },
        tooltip: { trigger: 'axis' },
        xAxis: { data: data.series.map(s => s.category) },
        yAxis: { name: '册' },
        series: [{
          name: '累计借阅量',
          type: 'bar',
          data: data.series.map(s => s.counts.reduce((sum, n) => sum + n, 0))
        }]
      });
    };

    let lineChart = null;
    const renderLineChart = data => {
      if (lineChart !== null) lineChart.destroy();
      const monthlyTotals = data.months.map((m, i) =>
        data.series.reduce((sum, s) => sum + s.counts[i], 0));
      lineChart = new Chart(document.querySelector('#line-chart'), {
        type: 'line',
        data: {
          labels: data.months,
          datasets: [{ label: '每月总借阅量', data: monthlyTotals, borderWidth: 2 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { title: { display: true, text: '校园图书馆每月总借阅量（单位：册）' } }
        }
      });
    };

    loadData();
  </script>

</body>
</html>
