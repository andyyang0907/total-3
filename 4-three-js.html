<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Three.js 旋转展示台</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; background: #16213e; }
    #info {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0,0,0,0.6); color: #fff; padding: 10px 14px;
      border-radius: 6px; font-size: 14px;
    }
    #info a { color: #fff; text-decoration: underline; }
  </style>
</head>

<body>

  <div id="info">
    <a href="index.html">← 作品集首页</a> · Three.js 旋转展示台（鼠标拖动旋转视角）
  </div>

  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x16213e);
    scene.fog = new THREE.Fog(0x16213e, 8, 20);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // 地面
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshStandardMaterial({ color: 0x1a2a4a, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 中心立方体（旋转展示台）
    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 1, 0.2, 32),
      new THREE.MeshStandardMaterial({ color: 0x424242 })
    );
    pedestal.position.y = 0.1;
    scene.add(pedestal);

    // 主体：三种几何体
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xef5350, roughness: 0.4, metalness: 0.3 })
    );
    box.position.set(-2, 1.5, 0);
    scene.add(box);

    const cylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.4, 1.5, 32),
      new THREE.MeshStandardMaterial({ color: 0x4fc3f7, roughness: 0.3, metalness: 0.6 })
    );
    cylinder.position.set(0, 1.5, 0);
    scene.add(cylinder);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.5, metalness: 0.2 })
    );
    sphere.position.set(2, 1.5, 0);
    scene.add(sphere);

    // 灯光
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 10, 7);
    scene.add(dir);
    const point = new THREE.PointLight(0xff9800, 0.6);
    point.position.set(-3, 4, 2);
    scene.add(point);

    // 动画
    let t = 0;
    const animate = () => {
      requestAnimationFrame(animate);
      t += 0.01;
      box.rotation.y += 0.01;
      sphere.position.y = 1.5 + Math.sin(t) * 0.3;
      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
